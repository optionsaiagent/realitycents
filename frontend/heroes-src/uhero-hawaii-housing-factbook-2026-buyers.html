<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; background: #061C31; position: relative; }
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061C31"/>
      <stop offset="70%" stop-color="#0C2340"/>
      <stop offset="100%" stop-color="#122C4C"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EBB890" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#EBB890" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EBB890" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00686A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00686A" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun disc behind the island peak -->
  <circle cx="880" cy="270" r="260" fill="url(#moonGlow)"/>
  <circle cx="880" cy="270" r="96" fill="#D39562" fill-opacity="0.9"/>
  <circle cx="880" cy="270" r="96" fill="none" stroke="#EBB890" stroke-width="2" stroke-opacity="0.6"/>

  <!-- faint report grid -->
  <g stroke="#F5EDE4" stroke-opacity="0.06" stroke-width="1">
    <line x1="200" y1="220" x2="1400" y2="220"/>
    <line x1="200" y1="320" x2="1400" y2="320"/>
    <line x1="200" y1="420" x2="1400" y2="420"/>
    <line x1="200" y1="520" x2="1400" y2="520"/>
    <line x1="200" y1="620" x2="1400" y2="620"/>
  </g>

  <!-- report spine at left with ticks -->
  <line x1="238" y1="180" x2="238" y2="700" stroke="#F5EDE4" stroke-opacity="0.28" stroke-width="2"/>
  <g stroke="#F5EDE4" stroke-opacity="0.2" stroke-width="1.5">
    <line x1="228" y1="220" x2="238" y2="220"/>
    <line x1="228" y1="320" x2="238" y2="320"/>
    <line x1="228" y1="420" x2="238" y2="420"/>
    <line x1="228" y1="520" x2="238" y2="520"/>
    <line x1="228" y1="620" x2="238" y2="620"/>
  </g>

  <!-- === STACKED CHART PLATES forming an island silhouette === -->
  <!-- plates are horizontal bars; right/left extents shape a volcano profile, peak near x=880 -->

  <!-- plate 8 (summit) -->
  <rect x="820" y="326" width="126" height="34" rx="8" fill="#EBB890"/>
  <!-- plate 7 -->
  <rect x="762" y="370" width="240" height="34" rx="8" fill="#D39562"/>
  <circle cx="964" cy="387" r="4" fill="#061C31"/>
  <!-- plate 6 -->
  <rect x="700" y="414" width="368" height="34" rx="8" fill="#2CA2A2"/>
  <rect x="712" y="427" width="120" height="8" rx="4" fill="#061C31" fill-opacity="0.3"/>
  <!-- plate 5 -->
  <rect x="628" y="458" width="512" height="34" rx="8" fill="#008687"/>
  <circle cx="660" cy="475" r="4" fill="#F5EDE4" fill-opacity="0.8"/>
  <circle cx="686" cy="475" r="4" fill="#F5EDE4" fill-opacity="0.55"/>
  <circle cx="712" cy="475" r="4" fill="#F5EDE4" fill-opacity="0.3"/>
  <!-- plate 4 -->
  <rect x="548" y="502" width="668" height="34" rx="8" fill="#00686A"/>
  <rect x="1080" y="515" width="108" height="8" rx="4" fill="#F5EDE4" fill-opacity="0.35"/>
  <!-- plate 3 -->
  <rect x="464" y="546" width="828" height="34" rx="8" fill="#008687"/>
  <g fill="#F5EDE4" fill-opacity="0.5">
    <rect x="492" y="559" width="60" height="8" rx="4"/>
    <rect x="568" y="559" width="34" height="8" rx="4"/>
  </g>
  <!-- plate 2 -->
  <rect x="386" y="590" width="960" height="34" rx="8" fill="#2CA2A2"/>
  <circle cx="1308" cy="607" r="4" fill="#061C31"/>
  <circle cx="1282" cy="607" r="4" fill="#061C31" fill-opacity="0.6"/>
  <!-- plate 1 (base / shoreline) -->
  <rect x="312" y="634" width="1090" height="34" rx="8" fill="#F5EDE4"/>
  <rect x="340" y="647" width="150" height="8" rx="4" fill="#061C31" fill-opacity="0.35"/>
  <rect x="1230" y="647" width="80" height="8" rx="4" fill="#061C31" fill-opacity="0.35"/>

  <!-- sea line + reflection wash below the island -->
  <line x1="200" y1="692" x2="1400" y2="692" stroke="#2CA2A2" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="312" y="700" width="1090" height="60" fill="url(#sea)"/>
  <g stroke="#2CA2A2" stroke-opacity="0.3" stroke-width="2">
    <line x1="420" y1="714" x2="640" y2="714"/>
    <line x1="760" y1="730" x2="1060" y2="730"/>
    <line x1="1140" y1="714" x2="1300" y2="714"/>
  </g>

  <!-- tiny data crosses in the sky, like plotted points -->
  <g stroke="#F5EDE4" stroke-opacity="0.35" stroke-width="2">
    <path d="M 400 258 h 14 M 407 251 v 14"/>
    <path d="M 1240 210 h 14 M 1247 203 v 14"/>
    <path d="M 1330 340 h 14 M 1337 333 v 14"/>
  </g>
</svg>
</body>
</html>
