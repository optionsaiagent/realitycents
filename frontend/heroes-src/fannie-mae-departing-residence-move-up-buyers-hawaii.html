<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; background: #F5EDE4; position: relative; }
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFE5D6"/>
      <stop offset="50%" stop-color="#F5EDE4"/>
      <stop offset="100%" stop-color="#F8F2EA"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#ground)"/>

  <!-- horizon rules -->
  <line x1="120" y1="742" x2="1480" y2="742" stroke="#061C31" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="220" y1="766" x2="1380" y2="766" stroke="#061C31" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- ══ THE DEPARTING RESIDENCE (left): kept, becomes the rental ══ -->
  <g>
    <!-- house body, outline -->
    <rect x="240" y="482" width="300" height="260" rx="6" fill="none" stroke="#061C31" stroke-width="5"/>
    <!-- roof -->
    <path d="M 214 486 L 390 356 L 566 486" fill="none" stroke="#061C31" stroke-width="5" stroke-linejoin="round"/>
    <!-- door -->
    <rect x="356" y="612" width="68" height="130" rx="4" fill="#061C31"/>
    <!-- windows: teal, lit -->
    <rect x="276" y="530" width="52" height="52" rx="4" fill="#008687"/>
    <rect x="452" y="530" width="52" height="52" rx="4" fill="#008687"/>
    <!-- rental cycle ring above the roof: circular arrows -->
    <g transform="translate(390 292)">
      <path d="M -44 8 A 46 46 0 1 1 8 44" fill="none" stroke="#00686A" stroke-width="6" stroke-linecap="round"/>
      <path d="M 8 44 l 18 -14 l -4 22 z" fill="#00686A"/>
      <!-- key inside the cycle -->
      <g stroke="#D39562" stroke-width="5" fill="none" stroke-linecap="round">
        <circle cx="-8" cy="-6" r="11"/>
        <line x1="1" y1="1" x2="22" y2="18"/>
        <line x1="14" y1="12" x2="8" y2="20"/>
      </g>
    </g>
  </g>

  <!-- ══ THE 75% OFFSET DISC (center) ══ -->
  <g transform="translate(800 430)">
    <!-- full ring, faint dashed = the whole rent -->
    <circle r="98" fill="none" stroke="#061C31" stroke-opacity="0.18" stroke-width="10" stroke-dasharray="4 12"/>
    <!-- 270° teal arc = the 75% that counts (from 12 o'clock, clockwise) -->
    <path d="M 0 -98 A 98 98 0 1 1 -98 0" fill="none" stroke="#00686A" stroke-width="14" stroke-linecap="round"/>
    <!-- gold house glyph at center -->
    <g stroke="#D39562" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -40 6 L 0 -28 L 40 6"/>
      <path d="M -28 6 L -28 40 L 28 40 L 28 6"/>
    </g>
  </g>

  <!-- motion arrow: past under the disc, toward the next home -->
  <line x1="600" y1="592" x2="988" y2="592" stroke="#061C31" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="4 16"/>
  <path d="M 988 592 l -30 -12 l 0 24 z" fill="#061C31" fill-opacity="0.45"/>

  <!-- ══ THE NEXT HOME (right): larger, solid, arrived ══ -->
  <g>
    <!-- roof rule -->
    <path d="M 1004 402 L 1210 262 L 1416 402" fill="none" stroke="#2CA2A2" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- body -->
    <rect x="1030" y="404" width="360" height="338" rx="6" fill="#061C31"/>
    <!-- window grid, teal -->
    <g fill="#008687">
      <rect x="1064" y="440" width="52" height="52" rx="4"/>
      <rect x="1154" y="440" width="52" height="52" rx="4"/>
      <rect x="1244" y="440" width="52" height="52" rx="4"/>
      <rect x="1064" y="530" width="52" height="52" rx="4"/>
      <rect x="1244" y="530" width="52" height="52" rx="4"/>
    </g>
    <!-- one gold-lit window -->
    <rect x="1154" y="530" width="52" height="52" rx="4" fill="#D39562"/>
    <!-- door with sand canopy -->
    <rect x="1166" y="626" width="88" height="116" rx="4" fill="#F5EDE4" fill-opacity="0.92"/>
    <rect x="1196" y="668" width="10" height="10" rx="5" fill="#061C31"/>
  </g>

  <!-- approval seal, upper right -->
  <g transform="translate(1462 250)">
    <circle r="52" fill="none" stroke="#D39562" stroke-width="3"/>
    <circle r="40" fill="none" stroke="#D39562" stroke-width="1.5" stroke-dasharray="5 6"/>
    <path d="M -16 0 l 11 13 l 22 -26" fill="none" stroke="#D39562" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- subtle palm frond cue, bottom left -->
  <g stroke="#00686A" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 148 742 C 154 690 172 652 208 624"/>
    <path d="M 150 742 C 130 700 126 660 140 616"/>
    <path d="M 149 742 C 176 706 214 686 258 680"/>
    <path d="M 149 742 C 122 714 88 700 48 700"/>
  </g>
</svg>
</body>
</html>
