<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- fannie-mae-departing-residence-move-up-buyers-hawaii — photo + navy diagonal panel (KB house style) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; background: #061C31; position: relative; font-family: 'Montserrat', sans-serif; }
  .photo { position: absolute; inset: 0; width: 1600px; height: 900px; object-fit: cover; object-position: 50% 50%; transform: scaleX(-1); }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,28,49,0.35) 0%, rgba(6,28,49,0) 55%); }
  .panel { position: absolute; left: 0; top: 0; width: 790px; height: 900px; background: #0C2340; clip-path: polygon(0 0, 790px 0, 640px 900px, 0 900px); }
  .edge { position: absolute; left: 0; top: 0; width: 806px; height: 900px; background: #2CA2A2; clip-path: polygon(790px 0, 806px 0, 656px 900px, 640px 900px); }
  .copy { position: absolute; left: 84px; top: 150px; width: 640px; }
  .eyebrow { font: 700 18px 'Montserrat'; letter-spacing: 0.24em; color: #2CA2A2; text-transform: uppercase; margin-bottom: 26px; }
  .h1 { font: 700 104px 'Oswald', sans-serif; line-height: 0.96; letter-spacing: 0.005em; color: #FFFFFF; text-transform: uppercase; }
  .h1 .alt { color: #2CA2A2; }
  .sub { margin-top: 30px; font: 700 34px 'Playfair Display', serif; line-height: 1.25; color: #F5EDE4; max-width: 560px; }
  .tag { display: inline-block; margin-top: 34px; background: #008687; color: #FFFFFF; font: 700 18px 'Montserrat'; letter-spacing: 0.2em; text-transform: uppercase; padding: 12px 22px; }
  .brand { position: absolute; left: 84px; bottom: 56px; font: 700 20px 'Montserrat'; color: #F5EDE4; letter-spacing: 0.02em; }
  .brand span { color: #2CA2A2; }
</style>
</head>
<body>
  <img class="photo" src="shots/photo-neighborhood-golden.png" alt="">
  <div class="shade"></div>
  <div class="panel"></div>
  <div class="edge"></div>
  <div class="copy">
    <div class="eyebrow">Fannie Mae &middot; Sept 2026</div>
    <div class="h1">Keep the<br>home.<br><span class="alt">Buy the next.</span></div>
    <div class="sub">The new departing-residence rules for Hawaii move-up buyers.</div>
    <div class="tag">Move-Up Buyers</div>
  </div>
  <div class="brand">Reality<span>Cents</span></div>
</body>
</html>
