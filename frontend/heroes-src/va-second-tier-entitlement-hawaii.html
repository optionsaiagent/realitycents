<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; background: #061C31; position: relative; font-family: 'Montserrat', sans-serif; }
  .photo { position: absolute; inset: 0; width: 1600px; height: 900px; object-fit: cover; object-position: 50% 55%; }
  .card { position: absolute; left: 84px; top: 96px; width: 740px; box-sizing: border-box; padding: 54px 56px 50px;
          background: rgba(245,237,228,0.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
          border-radius: 24px; box-shadow: 0 28px 70px rgba(6,28,49,0.30); border: 1px solid rgba(255,255,255,0.6); }
  .h1 { font: 700 96px 'Playfair Display', serif; line-height: 1.04; letter-spacing: -0.02em; color: #0C2340; }
  .h1 .alt { color: #00686A; }
  .sub { margin-top: 26px; font: 600 27px 'Montserrat'; line-height: 1.38; color: rgba(12,35,64,0.8); }
  .row { margin-top: 34px; display: flex; align-items: center; justify-content: space-between; }
  .tag { display: inline-block; background: #008687; color: #FFFFFF; font: 700 18px 'Montserrat'; letter-spacing: 0.2em; text-transform: uppercase; padding: 13px 22px; border-radius: 6px; }
  .brand { font: 700 22px 'Montserrat'; color: #0C2340; letter-spacing: 0.02em; }
  .brand span { color: #00686A; }
</style>
</head>
<body>
  <img class="photo" src="shots/nano-departing-residence.png" alt="">
  <div class="card">
    <div class="h1">Keep<br>the home.<br><span class="alt">Buy the next.</span></div>
    <div class="sub">Fannie Mae&rsquo;s new departing-residence rules let Hawaii move-up buyers qualify without selling first.</div>
    <div class="row">
      <div class="tag">Move-Up Buyers</div>
      <div class="brand">Reality<span>Cents</span></div>
    </div>
  </div>
</body>
</html>
