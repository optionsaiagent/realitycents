<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; background: #F5EDE4; position: relative; }
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFE5D6"/>
      <stop offset="50%" stop-color="#F5EDE4"/>
      <stop offset="100%" stop-color="#F8F2EA"/>
    </linearGradient>
    <linearGradient id="gateBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D39562" stop-opacity="0"/>
      <stop offset="18%" stop-color="#D39562" stop-opacity="0.9"/>
      <stop offset="82%" stop-color="#D39562" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D39562" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gateGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EBB890" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EBB890" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#EBB890" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#ground)"/>

  <!-- horizon rule -->
  <line x1="120" y1="742" x2="1480" y2="742" stroke="#061C31" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="220" y1="766" x2="1380" y2="766" stroke="#061C31" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- ══ BEFORE tower (left): askew, dashed, irregular windows ══ -->
  <g transform="rotate(-5 460 560)" opacity="0.55">
    <rect x="330" y="272" width="260" height="470" fill="none" stroke="#192F46" stroke-width="3" stroke-dasharray="14 10" rx="4"/>
    <!-- irregular scattered windows -->
    <g fill="#192F46" fill-opacity="0.5">
      <rect x="358" y="304" width="40" height="40" rx="3"/>
      <rect x="424" y="318" width="34" height="34" rx="3" transform="rotate(8 441 335)"/>
      <rect x="502" y="298" width="42" height="42" rx="3" transform="rotate(-7 523 319)"/>
      <rect x="366" y="392" width="34" height="34" rx="3" transform="rotate(-9 383 409)"/>
      <rect x="452" y="404" width="44" height="44" rx="3"/>
      <rect x="518" y="386" width="30" height="30" rx="3" transform="rotate(12 533 401)"/>
      <rect x="352" y="478" width="46" height="46" rx="3" transform="rotate(6 375 501)"/>
      <rect x="438" y="494" width="32" height="32" rx="3"/>
      <rect x="508" y="472" width="40" height="40" rx="3" transform="rotate(-11 528 492)"/>
      <rect x="372" y="572" width="34" height="34" rx="3" transform="rotate(-6 389 589)"/>
      <rect x="446" y="586" width="42" height="42" rx="3" transform="rotate(9 467 607)"/>
      <rect x="516" y="566" width="34" height="34" rx="3"/>
      <rect x="360" y="654" width="42" height="42" rx="3" transform="rotate(7 381 675)"/>
      <rect x="452" y="668" width="30" height="30" rx="3" transform="rotate(-8 467 683)"/>
      <rect x="512" y="648" width="44" height="44" rx="3" transform="rotate(5 534 670)"/>
    </g>
  </g>

  <!-- motion arrow through the gate -->
  <line x1="612" y1="500" x2="948" y2="500" stroke="#061C31" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="4 16"/>
  <path d="M 948 500 l -30 -12 l 0 24 z" fill="#061C31" fill-opacity="0.45"/>

  <!-- ══ THE GUIDELINES GATE (center) ══ -->
  <rect x="712" y="120" width="176" height="662" fill="url(#gateGlow)"/>
  <rect x="716" y="120" width="6" height="662" fill="url(#gateBeam)"/>
  <rect x="878" y="120" width="6" height="662" fill="url(#gateBeam)"/>

  <!-- checklist rungs inside the gate -->
  <g>
    <!-- rung: box + check + rule line -->
    <g transform="translate(742 236)">
      <rect x="0" y="0" width="34" height="34" rx="7" fill="none" stroke="#00686A" stroke-width="3.5"/>
      <path d="M 8 17 l 8 9 l 14 -17" fill="none" stroke="#00686A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="48" y1="17" x2="116" y2="17" stroke="#061C31" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(742 342)">
      <rect x="0" y="0" width="34" height="34" rx="7" fill="none" stroke="#00686A" stroke-width="3.5"/>
      <path d="M 8 17 l 8 9 l 14 -17" fill="none" stroke="#00686A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="48" y1="17" x2="100" y2="17" stroke="#061C31" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(742 448)">
      <rect x="0" y="0" width="34" height="34" rx="7" fill="none" stroke="#00686A" stroke-width="3.5"/>
      <path d="M 8 17 l 8 9 l 14 -17" fill="none" stroke="#00686A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="48" y1="17" x2="112" y2="17" stroke="#061C31" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(742 554)">
      <rect x="0" y="0" width="34" height="34" rx="7" fill="none" stroke="#00686A" stroke-width="3.5"/>
      <path d="M 8 17 l 8 9 l 14 -17" fill="none" stroke="#00686A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="48" y1="17" x2="94" y2="17" stroke="#061C31" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- last rung: empty box, review in progress -->
    <g transform="translate(742 660)">
      <rect x="0" y="0" width="34" height="34" rx="7" fill="none" stroke="#D39562" stroke-width="3.5"/>
      <line x1="48" y1="17" x2="108" y2="17" stroke="#061C31" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8"/>
    </g>
  </g>

  <!-- ══ AFTER tower (right): crisp, aligned, approved ══ -->
  <g>
    <rect x="1010" y="252" width="270" height="490" rx="6" fill="#061C31"/>
    <!-- aligned window grid, teal -->
    <g fill="#008687">
      <rect x="1042" y="288" width="42" height="42" rx="4"/>
      <rect x="1124" y="288" width="42" height="42" rx="4"/>
      <rect x="1206" y="288" width="42" height="42" rx="4"/>
      <rect x="1042" y="368" width="42" height="42" rx="4"/>
      <rect x="1124" y="368" width="42" height="42" rx="4"/>
      <rect x="1206" y="368" width="42" height="42" rx="4"/>
      <rect x="1042" y="448" width="42" height="42" rx="4"/>
      <rect x="1124" y="448" width="42" height="42" rx="4"/>
      <rect x="1206" y="448" width="42" height="42" rx="4"/>
      <rect x="1042" y="528" width="42" height="42" rx="4"/>
      <rect x="1124" y="528" width="42" height="42" rx="4"/>
      <rect x="1206" y="528" width="42" height="42" rx="4"/>
      <rect x="1042" y="608" width="42" height="42" rx="4"/>
      <rect x="1206" y="608" width="42" height="42" rx="4"/>
    </g>
    <!-- one gold-lit window -->
    <rect x="1124" y="608" width="42" height="42" rx="4" fill="#D39562"/>
    <!-- entry canopy -->
    <rect x="1108" y="690" width="74" height="52" rx="4" fill="#F5EDE4" fill-opacity="0.92"/>
    <!-- roof rule -->
    <line x1="1010" y1="252" x2="1280" y2="252" stroke="#2CA2A2" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- approval seal ring, upper right of tower -->
  <g transform="translate(1306 232)">
    <circle r="52" fill="none" stroke="#D39562" stroke-width="3"/>
    <circle r="40" fill="none" stroke="#D39562" stroke-width="1.5" stroke-dasharray="5 6"/>
    <path d="M -16 0 l 11 13 l 22 -26" fill="none" stroke="#D39562" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- subtle palm frond cue, bottom left -->
  <g stroke="#00686A" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 208 742 C 214 690 232 652 268 624"/>
    <path d="M 210 742 C 190 700 186 660 200 616"/>
    <path d="M 209 742 C 236 706 274 686 318 680"/>
    <path d="M 209 742 C 182 714 148 700 108 700"/>
  </g>
</svg>
</body>
</html>
