<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; background: #F5EDE4; position: relative; }
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFE5D6"/>
      <stop offset="50%" stop-color="#F5EDE4"/>
      <stop offset="100%" stop-color="#F8F2EA"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D39562" stop-opacity="0"/>
      <stop offset="20%" stop-color="#D39562" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#D39562" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D39562" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#ground)"/>
  <line x1="120" y1="742" x2="1480" y2="742" stroke="#061C31" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="220" y1="766" x2="1380" y2="766" stroke="#061C31" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- ══ LEFT: the house, on its lot ══ -->
  <g transform="translate(260 300)">
    <rect x="-150" y="330" width="300" height="12" fill="#061C31" fill-opacity="0.15"/>
    <polygon points="-170,160 0,30 170,160" fill="none" stroke="#061C31" stroke-width="7" stroke-linejoin="round"/>
    <rect x="-140" y="160" width="280" height="190" fill="#FCFAF6" stroke="#061C31" stroke-width="6" stroke-linejoin="round"/>
    <rect x="-40" y="250" width="80" height="100" fill="none" stroke="#061C31" stroke-width="6" stroke-linejoin="round"/>
    <rect x="-108" y="200" width="54" height="54" rx="4" fill="none" stroke="#00686A" stroke-width="5"/>
    <line x1="-81" y1="200" x2="-81" y2="254" stroke="#00686A" stroke-width="4"/>
    <line x1="-108" y1="227" x2="-54" y2="227" stroke="#00686A" stroke-width="4"/>
    <rect x="54" y="200" width="54" height="54" rx="4" fill="none" stroke="#00686A" stroke-width="5"/>
    <line x1="81" y1="200" x2="81" y2="254" stroke="#00686A" stroke-width="4"/>
    <line x1="54" y1="227" x2="108" y2="227" stroke="#00686A" stroke-width="4"/>
  </g>

  <!-- motion line from house toward the exemption bracket -->
  <line x1="470" y1="430" x2="620" y2="430" stroke="#061C31" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="4 14"/>
  <path d="M 620 430 l -28 -11 l 0 22 z" fill="#061C31" fill-opacity="0.45"/>

  <!-- ══ CENTER: the exemption bracket — a bar of value with a growing bite taken out ══ -->
  <g transform="translate(800 260)">
    <text x="0" y="-70" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="30" letter-spacing="1" fill="#061C31">ASSESSED VALUE</text>

    <!-- full value bar -->
    <rect x="-150" y="-20" width="300" height="56" rx="8" fill="#FCFAF6" stroke="#061C31" stroke-width="5"/>
    <!-- exemption bite, 2026 -->
    <rect x="-150" y="-20" width="92" height="56" rx="8" fill="#EBB890" stroke="#061C31" stroke-width="5"/>
    <text x="-104" y="14" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="18" fill="#061C31">2026</text>

    <!-- down arrow -->
    <line x1="0" y1="56" x2="0" y2="150" stroke="#061C31" stroke-opacity="0.4" stroke-width="4"/>
    <path d="M 0 150 l -14 -24 l 28 0 z" fill="#061C31" fill-opacity="0.55"/>

    <!-- full value bar, 2027, bigger bite -->
    <rect x="-150" y="170" width="300" height="56" rx="8" fill="#FCFAF6" stroke="#061C31" stroke-width="5"/>
    <rect x="-150" y="170" width="116" height="56" rx="8" fill="#00686A" stroke="#061C31" stroke-width="5"/>
    <text x="-92" y="204" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="18" fill="#F5EDE4">2027</text>

    <text x="0" y="266" text-anchor="middle" font-family="Georgia, serif" font-weight="600" font-size="19" letter-spacing="2" fill="#061C31" opacity="0.65">BIGGER EXEMPTION, SMALLER TAXABLE VALUE</text>
  </g>

  <!-- vertical light beam separating center from right, echoing the gate motif used elsewhere on the site -->
  <rect x="1060" y="120" width="5" height="620" fill="url(#beam)"/>

  <!-- ══ RIGHT: a calendar marking the filing deadline / effective date ══ -->
  <g transform="translate(1270 430)">
    <rect x="-140" y="-150" width="280" height="260" rx="18" fill="#FCFAF6" stroke="#061C31" stroke-width="6"/>
    <rect x="-140" y="-150" width="280" height="60" rx="18" fill="#061C31"/>
    <rect x="-140" y="-120" width="280" height="30" fill="#061C31"/>
    <circle cx="-80" cy="-150" r="10" fill="#D39562"/>
    <circle cx="80" cy="-150" r="10" fill="#D39562"/>
    <text x="0" y="-108" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="22" letter-spacing="2" fill="#F5EDE4">JULY</text>

    <text x="0" y="40" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="76" fill="#00686A">1</text>
    <text x="0" y="90" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="30" letter-spacing="3" fill="#061C31">2027</text>

    <g transform="translate(118 92)">
      <circle r="34" fill="#D39562"/>
      <path d="M -14 0 l 10 11 l 18 -22" fill="none" stroke="#FCFAF6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="800" y="830" text-anchor="middle" font-family="Georgia, serif" font-weight="600" font-size="20" letter-spacing="2" fill="#061C31" opacity="0.55">CITY &amp; COUNTY OF HONOLULU — ORDINANCES 25-42 &amp; 25-43</text>
</svg>
</body>
</html>
