<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>temporary-buydown-guide</title>
<style>
  @font-face {
    font-family: "Mont";
    src: url("/Users/madkow21/RealityCents/videos/aio-agent-explainer/assets/fonts/Montserrat-700.woff2") format("woff2");
    font-weight: 700;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 900px;
    overflow: hidden; position: relative;
    background: linear-gradient(180deg, #fcfaf6 0%, #faf5ee 100%);
  }
  .band {
    position: absolute; left: 0; top: 290px; width: 1600px; height: 370px;
    background: linear-gradient(180deg, rgba(245,237,228,0) 0%, rgba(245,237,228,0.9) 30%, rgba(245,237,228,0.9) 70%, rgba(245,237,228,0) 100%);
  }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div class="band"></div>
  <svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gG1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d39562"/><stop offset="1" stop-color="#c07f4c"/>
      </linearGradient>
      <linearGradient id="gG2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ebb890"/><stop offset="1" stop-color="#d39562"/>
      </linearGradient>
      <linearGradient id="gT1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2ca2a2"/><stop offset="1" stop-color="#008687"/>
      </linearGradient>
      <linearGradient id="gT2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#008687"/><stop offset="1" stop-color="#00686a"/>
      </linearGradient>
    </defs>

    <!-- baseline -->
    <line x1="180" y1="652" x2="1600" y2="652" stroke="#061c31" stroke-width="1.5" opacity="0.25"/>

    <!-- edge guides rising faintly from block corners -->
    <g stroke="#061c31" stroke-width="1" opacity="0.1">
      <line x1="340" y1="120" x2="340" y2="644"/>
      <line x1="576" y1="200" x2="576" y2="644"/>
      <line x1="812" y1="320" x2="812" y2="644"/>
      <line x1="1048" y1="420" x2="1048" y2="644"/>
    </g>

    <!-- stepped rate blocks: year 1 (-2), year 2 (-1), year 3+ (level) -->
    <rect x="340" y="310" width="230" height="334" fill="url(#gG1)"/>
    <rect x="576" y="430" width="230" height="214" fill="url(#gG2)"/>
    <rect x="812" y="550" width="230" height="94"  fill="url(#gT1)"/>
    <rect x="1048" y="550" width="552" height="94" fill="url(#gT2)"/>

    <!-- subtle top-face highlights -->
    <rect x="340" y="310" width="230" height="8" fill="#fcfaf6" opacity="0.45"/>
    <rect x="576" y="430" width="230" height="8" fill="#fcfaf6" opacity="0.45"/>
    <rect x="812" y="550" width="230" height="8" fill="#fcfaf6" opacity="0.45"/>
    <rect x="1048" y="550" width="552" height="8" fill="#fcfaf6" opacity="0.3"/>

    <!-- descending dashed trend, then level -->
    <path d="M 300 268 L 560 268 L 560 392 L 796 392 L 796 512 L 1440 512"
          fill="none" stroke="#061c31" stroke-width="2" stroke-dasharray="9 10" opacity="0.75"/>
    <circle cx="455" cy="268" r="6" fill="#061c31"/>
    <circle cx="691" cy="392" r="6" fill="#061c31"/>
    <circle cx="1120" cy="512" r="6" fill="#061c31"/>

    <!-- descent chevrons between steps -->
    <g stroke="#d39562" stroke-width="3" fill="none" opacity="0.9">
      <path d="M 560 322 L 573 336 L 586 322"/>
      <path d="M 796 446 L 809 460 L 822 446"/>
    </g>

    <!-- level arrow at the end -->
    <g stroke="#00686a" stroke-width="2.5" fill="none">
      <line x1="1330" y1="512" x2="1430" y2="512" stroke-dasharray="0"/>
      <path d="M 1416 500 L 1436 512 L 1416 524"/>
    </g>

    <!-- label chip -->
    <g>
      <rect x="330" y="164" width="248" height="52" rx="26" fill="#fcfaf6" stroke="#061c31" stroke-width="1.5"/>
      <circle cx="366" cy="190" r="8" fill="#d39562"/>
      <text x="388" y="197" font-family="Mont, sans-serif" font-weight="700" font-size="19" fill="#061c31" letter-spacing="3">2/1 BUYDOWN</text>
    </g>

    <!-- ground shadow hints -->
    <rect x="340" y="652" width="1260" height="10" fill="#061c31" opacity="0.06"/>
    <line x1="180" y1="700" x2="620" y2="700" stroke="#061c31" stroke-width="1" opacity="0.12"/>
    <line x1="180" y1="716" x2="460" y2="716" stroke="#061c31" stroke-width="1" opacity="0.07"/>
  </svg>
</body>
</html>
