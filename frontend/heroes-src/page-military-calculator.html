<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>page-military-calculator</title>
<style>
  html,body{margin:0;padding:0;width:1600px;height:900px;overflow:hidden;background:#0C2340;}
  svg{display:block;}
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081627"/>
      <stop offset="0.55" stop-color="#0C2340"/>
      <stop offset="1" stop-color="#10304A"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3C08F" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#C9995F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16425C"/>
      <stop offset="1" stop-color="#0F2F4C"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14535C"/>
      <stop offset="1" stop-color="#0E3A4E"/>
    </linearGradient>
    <linearGradient id="waveC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2C4A"/>
      <stop offset="1" stop-color="#091C33"/>
    </linearGradient>
    <linearGradient id="waveD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2038"/>
      <stop offset="1" stop-color="#061224"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.44" cy="0.44" r="0.95">
      <stop offset="0.55" stop-color="#050D18" stop-opacity="0"/>
      <stop offset="1" stop-color="#050D18" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- night field -->
  <rect width="1600" height="900" fill="url(#field)"/>

  <!-- honor star, upper right: one solid, one inscribed ring -->
  <ellipse cx="1210" cy="300" rx="460" ry="340" fill="url(#starGlow)"/>
  <g transform="translate(1210,290)">
    <circle r="150" fill="none" stroke="#E3C08F" stroke-width="1.5" opacity="0.4"/>
    <circle r="184" fill="none" stroke="#E3C08F" stroke-width="1" opacity="0.2"/>
    <circle r="224" fill="none" stroke="#4E9C9C" stroke-width="1" opacity="0.12"/>
    <!-- five-point star, points on r=112 circle -->
    <path d="M 0 -112 L 26.33 -34.61 L 106.53 -34.61 L 42.6 13.22 L 65.84 90.61 L 0 43.6 L -65.84 90.61 L -42.6 13.22 L -106.53 -34.61 L -26.33 -34.61 Z"
          fill="#C9995F" opacity="0.92"/>
    <path d="M 0 -112 L 26.33 -34.61 L 106.53 -34.61 L 42.6 13.22 L 65.84 90.61 L 0 43.6 L -65.84 90.61 L -42.6 13.22 L -106.53 -34.61 L -26.33 -34.61 Z"
          fill="none" stroke="#F1ECE2" stroke-width="1.5" opacity="0.35"/>
    <!-- facet shading for a struck-medal feel -->
    <path d="M 0 -112 L 26.33 -34.61 L -26.33 -34.61 Z" fill="#E3C08F" opacity="0.5"/>
    <path d="M 0 43.6 L 65.84 90.61 L 42.6 13.22 Z" fill="#8F6B3F" opacity="0.5"/>
    <path d="M 0 43.6 L -65.84 90.61 L -42.6 13.22 Z" fill="#8F6B3F" opacity="0.35"/>
  </g>

  <!-- small sentinel stars, sparse -->
  <g fill="#F1ECE2">
    <circle cx="240" cy="120" r="1.6" opacity="0.4"/>
    <circle cx="520" cy="82" r="1.3" opacity="0.32"/>
    <circle cx="760" cy="160" r="1.4" opacity="0.35"/>
    <circle cx="980" cy="90" r="1.2" opacity="0.3"/>
    <circle cx="1490" cy="120" r="1.5" opacity="0.4"/>
    <circle cx="380" cy="230" r="1.1" opacity="0.25"/>
  </g>

  <!-- island chain silhouette above the stripes -->
  <path d="M 60 540 L 128 512 Q 152 502 178 509 L 248 534 Q 268 540 292 540 Z" fill="#071527" opacity="0.9"/>
  <path d="M 330 540 L 412 496 Q 448 478 490 490 L 574 522 Q 610 535 655 540 Z" fill="#071527"/>
  <path d="M 700 540 L 752 522 Q 772 515 794 521 L 848 540 Z" fill="#08192E" opacity="0.85"/>
  <path d="M 900 540 L 946 526 Q 962 521 980 526 L 1022 540 Z" fill="#08192E" opacity="0.7"/>
  <line x1="0" y1="540" x2="1600" y2="540" stroke="#4E9C9C" stroke-width="1.2" opacity="0.35"/>

  <!-- stripes as ocean swells: broad, ordered, flag-cadence bands -->
  <path d="M 0 560 Q 400 546 800 560 T 1600 556 L 1600 626 Q 1200 640 800 626 T 0 630 Z" fill="url(#waveA)"/>
  <path d="M 0 630 Q 400 616 800 630 T 1600 626 L 1600 700 Q 1200 714 800 700 T 0 704 Z" fill="url(#waveB)"/>
  <path d="M 0 704 Q 400 690 800 704 T 1600 700 L 1600 778 Q 1200 792 800 778 T 0 782 Z" fill="url(#waveC)"/>
  <path d="M 0 782 Q 400 768 800 782 T 1600 778 L 1600 900 L 0 900 Z" fill="url(#waveD)"/>

  <!-- crest hairlines: alternating sand and gold, the stripe read -->
  <g fill="none" stroke-linecap="round">
    <path d="M 0 560 Q 400 546 800 560 T 1600 556" stroke="#F1ECE2" stroke-width="2" opacity="0.4"/>
    <path d="M 0 630 Q 400 616 800 630 T 1600 626" stroke="#C9995F" stroke-width="2" opacity="0.45"/>
    <path d="M 0 704 Q 400 690 800 704 T 1600 700" stroke="#F1ECE2" stroke-width="2" opacity="0.3"/>
    <path d="M 0 782 Q 400 768 800 782 T 1600 778" stroke="#C9995F" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- moonlit track from star to sea, restrained -->
  <g stroke="#E3C08F" stroke-linecap="round">
    <line x1="1180" y1="580" x2="1240" y2="580" stroke-width="2" opacity="0.3"/>
    <line x1="1160" y1="650" x2="1260" y2="650" stroke-width="2.5" opacity="0.22"/>
    <line x1="1184" y1="726" x2="1236" y2="726" stroke-width="3" opacity="0.16"/>
  </g>

  <!-- edge vignette -->
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
</body>
</html>
