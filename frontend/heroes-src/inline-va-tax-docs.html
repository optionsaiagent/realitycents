<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>inline-va-tax-docs</title>
<style>
  html,body{margin:0;padding:0;width:1600px;height:900px;overflow:hidden;background:#E2D9C9;}
  svg{display:block;}
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE5D6"/>
      <stop offset="0.55" stop-color="#E2D9C9"/>
      <stop offset="1" stop-color="#D3C6B0"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFCF9"/>
      <stop offset="1" stop-color="#F4EFE6"/>
    </linearGradient>
    <linearGradient id="sheetTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3F1"/>
      <stop offset="1" stop-color="#DCEAE7"/>
    </linearGradient>
    <radialGradient id="sealFace" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#1C3A5E"/>
      <stop offset="1" stop-color="#0C2340"/>
    </radialGradient>
    <linearGradient id="tagFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3C08F"/>
      <stop offset="1" stop-color="#C9995F"/>
    </linearGradient>
    <radialGradient id="deskVig" cx="0.46" cy="0.44" r="0.95">
      <stop offset="0.6" stop-color="#8A7A5E" stop-opacity="0"/>
      <stop offset="1" stop-color="#8A7A5E" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4A3E2A" flood-opacity="0.28"/>
    </filter>
    <filter id="liftShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4A3E2A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- desk surface -->
  <rect width="1600" height="900" fill="url(#desk)"/>
  <!-- desk grain hairlines -->
  <g stroke="#C7B89E" stroke-width="1.5" opacity="0.4">
    <line x1="0" y1="150" x2="1600" y2="118"/>
    <line x1="0" y1="460" x2="1600" y2="428"/>
    <line x1="0" y1="800" x2="1600" y2="768"/>
  </g>

  <!-- navy desk mat anchoring the composition -->
  <g transform="rotate(-1.5 800 480)">
    <rect x="260" y="140" width="1080" height="660" rx="18" fill="#0C2340" filter="url(#softShadow)"/>
    <rect x="278" y="158" width="1044" height="624" rx="12" fill="none" stroke="#C9995F" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- under-sheet, teal tinted, rotated right -->
  <g transform="rotate(5 940 470)">
    <rect x="700" y="200" width="440" height="560" rx="8" fill="url(#sheetTeal)" filter="url(#liftShadow)"/>
    <!-- abstract text: rounded bars only -->
    <g fill="#9DBEB9">
      <rect x="748" y="256" width="230" height="14" rx="7"/>
      <rect x="748" y="296" width="330" height="10" rx="5" opacity="0.8"/>
      <rect x="748" y="322" width="300" height="10" rx="5" opacity="0.8"/>
      <rect x="748" y="348" width="330" height="10" rx="5" opacity="0.8"/>
      <rect x="748" y="374" width="212" height="10" rx="5" opacity="0.8"/>
    </g>
    <!-- abstract figure column -->
    <g fill="#1A7A7A" opacity="0.65">
      <rect x="1002" y="430" width="80" height="10" rx="5"/>
      <rect x="1022" y="456" width="60" height="10" rx="5"/>
      <rect x="1012" y="482" width="70" height="10" rx="5"/>
    </g>
    <g fill="#9DBEB9" opacity="0.9">
      <rect x="748" y="430" width="150" height="10" rx="5"/>
      <rect x="748" y="456" width="170" height="10" rx="5"/>
      <rect x="748" y="482" width="140" height="10" rx="5"/>
    </g>
    <line x1="748" y1="516" x2="1082" y2="516" stroke="#1A7A7A" stroke-width="2" opacity="0.5"/>
    <!-- signature flourish -->
    <path d="M 760 620 C 800 588 830 646 872 606 C 902 578 926 618 986 600" fill="none" stroke="#0C2340" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="748" y1="648" x2="1010" y2="648" stroke="#9DBEB9" stroke-width="2"/>
  </g>

  <!-- top document sheet, rotated left -->
  <g transform="rotate(-4 640 470)">
    <rect x="420" y="190" width="460" height="580" rx="8" fill="url(#sheet)" filter="url(#liftShadow)"/>
    <!-- header band -->
    <rect x="420" y="190" width="460" height="74" rx="8" fill="#0C2340"/>
    <rect x="420" y="248" width="460" height="16" fill="#0C2340"/>
    <rect x="452" y="216" width="26" height="26" rx="13" fill="#C9995F"/>
    <rect x="494" y="220" width="180" height="9" rx="4.5" fill="#F1ECE2" opacity="0.9"/>
    <rect x="494" y="238" width="120" height="7" rx="3.5" fill="#4E9C9C"/>
    <!-- abstract body lines -->
    <g fill="#C9C0AE">
      <rect x="462" y="300" width="376" height="10" rx="5"/>
      <rect x="462" y="326" width="340" height="10" rx="5"/>
      <rect x="462" y="352" width="376" height="10" rx="5"/>
      <rect x="462" y="378" width="238" height="10" rx="5"/>
    </g>
    <!-- abstract table block -->
    <rect x="462" y="416" width="376" height="150" rx="6" fill="none" stroke="#C9C0AE" stroke-width="2"/>
    <line x1="462" y1="466" x2="838" y2="466" stroke="#C9C0AE" stroke-width="2"/>
    <line x1="462" y1="516" x2="838" y2="516" stroke="#C9C0AE" stroke-width="2"/>
    <line x1="672" y1="416" x2="672" y2="566" stroke="#C9C0AE" stroke-width="2"/>
    <g fill="#8FA6A0">
      <rect x="482" y="436" width="130" height="9" rx="4.5"/>
      <rect x="482" y="486" width="110" height="9" rx="4.5"/>
      <rect x="482" y="536" width="140" height="9" rx="4.5"/>
    </g>
    <g fill="#C9995F">
      <rect x="700" y="436" width="90" height="9" rx="4.5"/>
      <rect x="700" y="486" width="70" height="9" rx="4.5"/>
      <rect x="700" y="536" width="100" height="9" rx="4.5"/>
    </g>
    <!-- checkbox row -->
    <g>
      <rect x="462" y="606" width="18" height="18" rx="4" fill="none" stroke="#8FA6A0" stroke-width="2"/>
      <path d="M 466 615 L 471 620 L 478 609" fill="none" stroke="#1A7A7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="494" y="610" width="150" height="9" rx="4.5" fill="#C9C0AE"/>
      <rect x="682" y="606" width="18" height="18" rx="4" fill="none" stroke="#8FA6A0" stroke-width="2"/>
      <rect x="714" y="610" width="110" height="9" rx="4.5" fill="#C9C0AE"/>
    </g>
    <!-- footer rule -->
    <line x1="462" y1="700" x2="838" y2="700" stroke="#C9995F" stroke-width="2" opacity="0.7"/>
    <rect x="462" y="716" width="200" height="8" rx="4" fill="#C9C0AE" opacity="0.8"/>
  </g>

  <!-- VA star seal, overlapping both sheets -->
  <g transform="translate(918,258)" filter="url(#liftShadow)">
    <circle r="96" fill="url(#sealFace)"/>
    <circle r="96" fill="none" stroke="#C9995F" stroke-width="5"/>
    <circle r="78" fill="none" stroke="#E3C08F" stroke-width="1.5" opacity="0.8"/>
    <!-- rope tick ring -->
    <g stroke="#C9995F" stroke-width="2.5" opacity="0.85">
      <line x1="0" y1="-88" x2="0" y2="-80"/>
      <line x1="44" y1="-76.2" x2="40" y2="-69.3"/>
      <line x1="76.2" y1="-44" x2="69.3" y2="-40"/>
      <line x1="88" y1="0" x2="80" y2="0"/>
      <line x1="76.2" y1="44" x2="69.3" y2="40"/>
      <line x1="44" y1="76.2" x2="40" y2="69.3"/>
      <line x1="0" y1="88" x2="0" y2="80"/>
      <line x1="-44" y1="76.2" x2="-40" y2="69.3"/>
      <line x1="-76.2" y1="44" x2="-69.3" y2="40"/>
      <line x1="-88" y1="0" x2="-80" y2="0"/>
      <line x1="-76.2" y1="-44" x2="-69.3" y2="-40"/>
      <line x1="-44" y1="-76.2" x2="-40" y2="-69.3"/>
    </g>
    <!-- star, points on r=52 -->
    <path d="M 0 -52 L 12.22 -16.07 L 49.45 -16.07 L 19.78 6.14 L 30.56 42.07 L 0 20.24 L -30.56 42.07 L -19.78 6.14 L -49.45 -16.07 L -12.22 -16.07 Z"
          fill="#F1ECE2"/>
    <path d="M 0 -52 L 12.22 -16.07 L 49.45 -16.07 L 19.78 6.14 L 30.56 42.07 L 0 20.24 L -30.56 42.07 L -19.78 6.14 L -49.45 -16.07 L -12.22 -16.07 Z"
          fill="none" stroke="#C9995F" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- fee tag with string, lower right of the mat -->
  <g transform="rotate(12 1160 640)" filter="url(#liftShadow)">
    <path d="M 1058 612 L 1180 566 Q 1198 560 1216 566 L 1330 610 Q 1346 616 1346 634 L 1346 686 Q 1346 704 1330 710 L 1216 754 Q 1198 760 1180 754 L 1058 708 Q 1044 702 1044 686 L 1044 634 Q 1044 618 1058 612 Z"
          fill="url(#tagFace)"/>
    <circle cx="1096" cy="660" r="14" fill="#E2D9C9"/>
    <circle cx="1096" cy="660" r="14" fill="none" stroke="#8F6B3F" stroke-width="3"/>
    <!-- embossed circle-and-slash mark: fee waived -->
    <g transform="translate(1236,660)">
      <circle r="34" fill="none" stroke="#0C2340" stroke-width="5" opacity="0.85"/>
      <line x1="-22" y1="22" x2="22" y2="-22" stroke="#0C2340" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    </g>
    <rect x="1130" y="702" width="120" height="7" rx="3.5" fill="#8F6B3F" opacity="0.6"/>
  </g>
  <!-- tag string -->
  <path d="M 1103 646 C 1040 600 980 560 918 354" fill="none" stroke="#8F6B3F" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- calculator outline, lower left, quiet line art -->
  <g transform="rotate(-8 360 690)" filter="url(#liftShadow)">
    <rect x="250" y="560" width="220" height="290" rx="18" fill="#0C2340"/>
    <rect x="272" y="584" width="176" height="58" rx="8" fill="#12304A"/>
    <rect x="284" y="602" width="96" height="10" rx="5" fill="#4E9C9C" opacity="0.9"/>
    <g fill="#1C3A5E">
      <rect x="272" y="664" width="38" height="34" rx="8"/>
      <rect x="318" y="664" width="38" height="34" rx="8"/>
      <rect x="364" y="664" width="38" height="34" rx="8"/>
      <rect x="272" y="708" width="38" height="34" rx="8"/>
      <rect x="318" y="708" width="38" height="34" rx="8"/>
      <rect x="364" y="708" width="38" height="34" rx="8"/>
      <rect x="272" y="752" width="38" height="34" rx="8"/>
      <rect x="318" y="752" width="38" height="34" rx="8"/>
      <rect x="364" y="752" width="38" height="34" rx="8"/>
      <rect x="272" y="796" width="84" height="34" rx="8"/>
    </g>
    <rect x="410" y="664" width="38" height="78" rx="8" fill="#1A7A7A"/>
    <rect x="410" y="752" width="38" height="78" rx="8" fill="#C9995F"/>
    <!-- key glyph hints: plus and equals as pure marks -->
    <g stroke="#F1ECE2" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="429" y1="690" x2="429" y2="716"/>
      <line x1="416" y1="703" x2="442" y2="703"/>
      <line x1="418" y1="784" x2="440" y2="784"/>
      <line x1="418" y1="798" x2="440" y2="798"/>
    </g>
  </g>

  <!-- pencil, resting across the lower mat -->
  <g transform="rotate(24 760 760)" filter="url(#liftShadow)">
    <rect x="560" y="748" width="330" height="22" rx="4" fill="#C9995F"/>
    <rect x="560" y="748" width="330" height="7" rx="3.5" fill="#E3C08F"/>
    <path d="M 890 748 L 934 759 L 890 770 Z" fill="#F1ECE2"/>
    <path d="M 918 755 L 934 759 L 918 763 Z" fill="#0C2340"/>
    <rect x="540" y="748" width="20" height="22" rx="4" fill="#1A7A7A"/>
  </g>

  <!-- desk vignette -->
  <rect width="1600" height="900" fill="url(#deskVig)"/>
</svg>
</body>
</html>
