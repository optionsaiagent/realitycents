<!-- fha-loans-hawaii-explained — the bar, lowered into an open doorway -->
<style>
  html,body{margin:0;padding:0;}
  body{width:1600px;height:900px;overflow:hidden;background:#f5ede4;}
  svg{display:block;}
</style>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#f5ede4"/>

  <!-- morning sun behind the doorway -->
  <circle cx="800" cy="330" r="230" fill="#ebb890" opacity="0.38"/>
  <circle cx="800" cy="330" r="300" fill="none" stroke="#ebb890" stroke-width="2" opacity="0.5"/>

  <!-- doorway: rounded arch -->
  <path d="M640 770 V420 Q640 250 800 250 Q960 250 960 420 V770"
        fill="#fcfaf6" stroke="#008687" stroke-width="14" stroke-linecap="round"/>
  <!-- inner arch line -->
  <path d="M676 770 V424 Q676 288 800 288 Q924 288 924 424 V770"
        fill="none" stroke="#2ca2a2" stroke-width="3" opacity="0.7"/>

  <!-- where the bar used to be -->
  <line x1="520" y1="380" x2="1080" y2="380" stroke="#192f46" stroke-width="4" stroke-dasharray="14 14" stroke-linecap="round" opacity="0.45"/>

  <!-- it came down -->
  <line x1="480" y1="416" x2="480" y2="548" stroke="#061c31" stroke-width="4" stroke-linecap="round"/>
  <path d="M462 528 L480 556 L498 528" fill="none" stroke="#061c31" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1120" y1="416" x2="1120" y2="548" stroke="#061c31" stroke-width="4" stroke-linecap="round"/>
  <path d="M1102 528 L1120 556 L1138 528" fill="none" stroke="#061c31" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the lowered bar: an easy step -->
  <rect x="500" y="588" width="600" height="30" rx="15" fill="#d39562"/>

  <!-- welcome step + ground -->
  <rect x="580" y="646" width="440" height="24" rx="12" fill="#dfd6c9"/>
  <line x1="220" y1="702" x2="1380" y2="702" stroke="#061c31" stroke-width="4" stroke-linecap="round"/>

  <!-- friendly footpath dots leading in -->
  <circle cx="330" cy="748" r="9" fill="#008687"/>
  <circle cx="420" cy="736" r="9" fill="#008687" opacity="0.75"/>
  <circle cx="508" cy="744" r="9" fill="#008687" opacity="0.5"/>

  <!-- balancing hairlines -->
  <line x1="180" y1="260" x2="360" y2="260" stroke="#dfd6c9" stroke-width="2.5"/>
  <line x1="1240" y1="260" x2="1420" y2="260" stroke="#dfd6c9" stroke-width="2.5"/>
</svg>
