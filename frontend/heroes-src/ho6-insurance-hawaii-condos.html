<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ho6-insurance-hawaii-condos</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 900px;
    overflow: hidden; position: relative;
    background: linear-gradient(160deg, #f5ede4 0%, #efe4d5 55%, #dfd6c9 100%);
  }
  .vig {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 1200px 700px at 46% 50%, rgba(252,250,246,0.65) 0%, rgba(252,250,246,0) 60%);
  }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div class="vig"></div>
  <svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gUnit" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2ca2a2"/><stop offset="1" stop-color="#008687"/>
      </linearGradient>
    </defs>

    <!-- tower shell (bleeds top and bottom) -->
    <rect x="435" y="-40" width="330" height="980" fill="#fcfaf6" fill-opacity="0.55" stroke="#061c31" stroke-width="2"/>
    <line x1="435" y1="96" x2="765" y2="96" stroke="#061c31" stroke-width="1.5" opacity="0.5"/>
    <line x1="600" y1="-40" x2="600" y2="96" stroke="#061c31" stroke-width="1" opacity="0.25"/>

    <!-- window grid (floors) -->
    <g stroke="#061c31" stroke-width="1.2" fill="none" opacity="0.20">
      <!-- floors above unit -->
      <g>
        <rect x="466" y="130" width="52" height="36"/><rect x="540" y="130" width="52" height="36"/><rect x="614" y="130" width="52" height="36"/><rect x="688" y="130" width="52" height="36"/>
        <rect x="466" y="196" width="52" height="36"/><rect x="540" y="196" width="52" height="36"/><rect x="614" y="196" width="52" height="36"/><rect x="688" y="196" width="52" height="36"/>
        <rect x="466" y="262" width="52" height="36"/><rect x="540" y="262" width="52" height="36"/><rect x="614" y="262" width="52" height="36"/><rect x="688" y="262" width="52" height="36"/>
        <rect x="466" y="328" width="52" height="36"/><rect x="540" y="328" width="52" height="36"/><rect x="614" y="328" width="52" height="36"/><rect x="688" y="328" width="52" height="36"/>
      </g>
      <!-- floors below unit -->
      <g>
        <rect x="466" y="536" width="52" height="36"/><rect x="540" y="536" width="52" height="36"/><rect x="614" y="536" width="52" height="36"/><rect x="688" y="536" width="52" height="36"/>
        <rect x="466" y="602" width="52" height="36"/><rect x="540" y="602" width="52" height="36"/><rect x="614" y="602" width="52" height="36"/><rect x="688" y="602" width="52" height="36"/>
        <rect x="466" y="668" width="52" height="36"/><rect x="540" y="668" width="52" height="36"/><rect x="614" y="668" width="52" height="36"/><rect x="688" y="668" width="52" height="36"/>
        <rect x="466" y="734" width="52" height="36"/><rect x="540" y="734" width="52" height="36"/><rect x="614" y="734" width="52" height="36"/><rect x="688" y="734" width="52" height="36"/>
      </g>
    </g>

    <!-- radiating halos around the insured unit -->
    <rect x="404" y="360" width="392" height="182" rx="22" fill="none" stroke="#008687" stroke-width="1.5" opacity="0.34"/>
    <rect x="368" y="330" width="464" height="242" rx="30" fill="none" stroke="#008687" stroke-width="1.2" opacity="0.16"/>

    <!-- the unit: walls-in -->
    <g>
      <rect x="440" y="388" width="320" height="126" rx="12" fill="url(#gUnit)"/>
      <!-- the insured interior walls -->
      <rect x="456" y="402" width="288" height="98" rx="8" fill="none" stroke="#fcfaf6" stroke-width="3"/>
      <!-- abstract interior: sofa + lamp + rug -->
      <rect x="486" y="458" width="94" height="26" rx="8" fill="#fcfaf6" opacity="0.9"/>
      <rect x="494" y="440" width="78" height="20" rx="7" fill="#fcfaf6" opacity="0.65"/>
      <line x1="622" y1="484" x2="622" y2="438" stroke="#fcfaf6" stroke-width="2.5" opacity="0.9"/>
      <circle cx="622" cy="430" r="9" fill="#ebb890"/>
      <rect x="648" y="478" width="66" height="6" rx="3" fill="#fcfaf6" opacity="0.55"/>
    </g>

    <!-- shield over the unit -->
    <path d="M 760 386 C 786 398, 812 402, 836 402 C 836 462, 812 502, 760 522 C 708 502, 684 462, 684 402 C 708 402, 734 398, 760 386 Z"
          fill="#f5ede4" fill-opacity="0.16" stroke="#d39562" stroke-width="3.5"/>
    <path d="M 760 412 C 776 419, 792 422, 806 422 C 806 462, 792 486, 760 500 C 728 486, 714 462, 714 422 C 728 422, 744 419, 760 412 Z"
          fill="none" stroke="#d39562" stroke-width="1.5" opacity="0.6"/>

    <!-- right side: walls-in vs all-in glyph -->
    <g>
      <line x1="920" y1="451" x2="1082" y2="451" stroke="#061c31" stroke-width="1.2" opacity="0.35"/>
      <rect x="1096" y="406" width="90" height="90" fill="none" stroke="#061c31" stroke-width="1.8" opacity="0.65"/>
      <rect x="1114" y="424" width="54" height="54" fill="#008687" opacity="0.88"/>
      <line x1="1200" y1="451" x2="1338" y2="451" stroke="#061c31" stroke-width="1.2" opacity="0.35"/>
    </g>
    <g stroke="#061c31" stroke-width="1" opacity="0.2">
      <line x1="920" y1="420" x2="1010" y2="420"/>
      <line x1="920" y1="482" x2="1010" y2="482"/>
    </g>

    <!-- thin horizon rules, lower right -->
    <line x1="980" y1="720" x2="1420" y2="720" stroke="#061c31" stroke-width="1" opacity="0.18"/>
    <line x1="1100" y1="738" x2="1420" y2="738" stroke="#061c31" stroke-width="1" opacity="0.1"/>

    <!-- faint neighboring tower, background right -->
    <rect x="850" y="120" width="150" height="820" fill="none" stroke="#061c31" stroke-width="1.2" opacity="0.12"/>
    <line x1="850" y1="180" x2="1000" y2="180" stroke="#061c31" stroke-width="1" opacity="0.1"/>
  </svg>
</body>
</html>
