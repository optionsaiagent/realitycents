<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>how-lenders-calculate-income</title>
<style>
  @font-face {
    font-family: "PlexMono";
    src: url("/Users/madkow21/RealityCents/videos/aio-agent-explainer/assets/fonts/IBMPlexMono-700.woff2") format("woff2");
    font-weight: 700;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 900px;
    overflow: hidden; position: relative;
    background: linear-gradient(135deg, #fcfaf6 0%, #f5ede4 62%, #efe5d8 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(90deg, rgba(6,28,49,0.045) 0 1px, transparent 1px 100px),
      repeating-linear-gradient(0deg, rgba(6,28,49,0.03) 0 1px, transparent 1px 100px);
  }
  .glow {
    position: absolute; left: 470px; top: 130px; width: 640px; height: 640px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(211,149,98,0.22) 0%, rgba(211,149,98,0) 65%);
  }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2ca2a2"/><stop offset="1" stop-color="#008687"/>
      </linearGradient>
      <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ebb890"/><stop offset="1" stop-color="#d39562"/>
      </linearGradient>
      <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#192f46"/><stop offset="1" stop-color="#061c31"/>
      </linearGradient>
      <linearGradient id="gOut" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#00686a"/><stop offset="1" stop-color="#008687"/>
      </linearGradient>
    </defs>

    <!-- depth echo circles, upper right -->
    <circle cx="1340" cy="150" r="215" fill="none" stroke="#dfd6c9" stroke-width="1.5"/>
    <circle cx="1340" cy="150" r="170" fill="none" stroke="#dfd6c9" stroke-width="1" opacity="0.7"/>

    <!-- three income streams -->
    <path d="M -40 250 C 300 250, 480 348, 636 414" fill="none" stroke="url(#gTeal)" stroke-width="30" stroke-linecap="round"/>
    <path d="M -40 452 C 300 452, 480 448, 630 449" fill="none" stroke="url(#gGold)" stroke-width="18" stroke-linecap="round"/>
    <path d="M -40 652 C 300 652, 480 556, 636 488" fill="none" stroke="url(#gNavy)" stroke-width="38" stroke-linecap="round"/>

    <!-- stream origin tick labels (geometry only) -->
    <circle cx="66" cy="250" r="5" fill="#fcfaf6"/>
    <circle cx="66" cy="452" r="4" fill="#fcfaf6"/>
    <circle cx="66" cy="652" r="6" fill="#fcfaf6"/>

    <!-- calculation lens -->
    <g>
      <line x1="790" y1="40" x2="790" y2="242" stroke="#061c31" stroke-width="1" opacity="0.15"/>
      <line x1="790" y1="658" x2="790" y2="860" stroke="#061c31" stroke-width="1" opacity="0.15"/>
      <circle cx="790" cy="450" r="168" fill="#fcfaf6" fill-opacity="0.72" stroke="#061c31" stroke-width="2.5"/>
      <circle cx="790" cy="450" r="120" fill="none" stroke="#008687" stroke-width="1.5" stroke-dasharray="2 10"/>
      <!-- radial ticks -->
      <g stroke="#061c31" stroke-width="2" opacity="0.55">
        <line x1="790" y1="282" x2="790" y2="298"/>
        <line x1="790" y1="602" x2="790" y2="618"/>
        <line x1="622" y1="450" x2="638" y2="450"/>
        <line x1="942" y1="450" x2="958" y2="450"/>
        <line x1="908.8" y1="331.2" x2="897.5" y2="342.5"/>
        <line x1="671.2" y1="568.8" x2="682.5" y2="557.5"/>
        <line x1="671.2" y1="331.2" x2="682.5" y2="342.5"/>
        <line x1="908.8" y1="568.8" x2="897.5" y2="557.5"/>
      </g>
      <!-- inner mechanism: three inputs resolve to one node -->
      <circle cx="716" cy="400" r="11" fill="#008687"/>
      <circle cx="708" cy="450" r="8"  fill="#d39562"/>
      <circle cx="716" cy="500" r="13" fill="#192f46"/>
      <line x1="727" y1="404" x2="848" y2="444" stroke="#061c31" stroke-width="1.2" opacity="0.5"/>
      <line x1="716" y1="450" x2="846" y2="450" stroke="#061c31" stroke-width="1.2" opacity="0.5"/>
      <line x1="729" y1="496" x2="848" y2="456" stroke="#061c31" stroke-width="1.2" opacity="0.5"/>
      <circle cx="866" cy="450" r="20" fill="#d39562"/>
      <circle cx="866" cy="450" r="27" fill="none" stroke="#d39562" stroke-width="1.5" stroke-dasharray="3 6"/>
    </g>

    <!-- single qualifying stream out -->
    <path d="M 958 450 L 1298 450" stroke="url(#gOut)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="1322" cy="450" r="11" fill="#008687"/>
    <circle cx="1322" cy="450" r="23" fill="none" stroke="#008687" stroke-width="1.5" stroke-dasharray="3 7"/>

    <!-- one qualifying figure -->
    <g>
      <rect x="1176" y="500" width="230" height="58" rx="10" fill="#fcfaf6" stroke="#061c31" stroke-width="1.5"/>
      <text x="1291" y="538" text-anchor="middle" font-family="PlexMono, monospace" font-weight="700" font-size="27" fill="#061c31" letter-spacing="1">$9,240/MO</text>
    </g>

    <!-- baseline hairlines lower left -->
    <line x1="120" y1="790" x2="560" y2="790" stroke="#061c31" stroke-width="1" opacity="0.18"/>
    <line x1="120" y1="806" x2="420" y2="806" stroke="#061c31" stroke-width="1" opacity="0.1"/>
  </svg>
</body>
</html>
