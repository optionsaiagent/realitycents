<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>page-home</title>
<style>
  html,body{margin:0;padding:0;width:1600px;height:900px;overflow:hidden;background:#0C2340;}
  svg{display:block;}
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1B33"/>
      <stop offset="0.45" stop-color="#0F2C48"/>
      <stop offset="0.85" stop-color="#155060"/>
      <stop offset="1" stop-color="#1A6A6E"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#156067"/>
      <stop offset="0.35" stop-color="#0F3E52"/>
      <stop offset="1" stop-color="#081A30"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3C08F" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C9995F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C9995F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glimmer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3C08F" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E3C08F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.42" cy="0.46" r="0.9">
      <stop offset="0.55" stop-color="#06111F" stop-opacity="0"/>
      <stop offset="1" stop-color="#06111F" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="bandFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4E9C9C" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#4E9C9C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4E9C9C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1600" height="510" fill="url(#sky)"/>

  <!-- low sun glow, upper right -->
  <ellipse cx="1210" cy="430" rx="480" ry="330" fill="url(#sunGlow)"/>
  <circle cx="1210" cy="392" r="62" fill="#E3C08F" opacity="0.85"/>
  <circle cx="1210" cy="392" r="62" fill="none" stroke="#F1ECE2" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- island chain silhouettes on the horizon (right-weighted) -->
  <path d="M 890 505 L 960 468 Q 985 456 1012 464 L 1080 492 Q 1100 500 1125 505 Z" fill="#0A1E33" opacity="0.9"/>
  <path d="M 1130 505 L 1215 438 Q 1252 410 1298 424 L 1380 456 Q 1450 480 1530 496 L 1600 505 Z" fill="#081A2E"/>
  <path d="M 250 505 L 305 484 Q 328 476 352 482 L 415 502 Z" fill="#0C2544" opacity="0.55"/>
  <path d="M 640 505 L 688 490 Q 703 485 720 490 L 762 505 Z" fill="#0B2340" opacity="0.5"/>

  <!-- sea -->
  <rect x="0" y="505" width="1600" height="395" fill="url(#sea)"/>

  <!-- horizon hairline -->
  <rect x="0" y="504" width="1600" height="1.5" fill="#4E9C9C" opacity="0.5"/>

  <!-- sun path shimmer on water -->
  <path d="M 1170 508 L 1250 508 L 1330 900 L 1090 900 Z" fill="url(#glimmer)"/>
  <g stroke="#E3C08F" stroke-linecap="round">
    <line x1="1180" y1="530" x2="1244" y2="530" stroke-width="2" opacity="0.4"/>
    <line x1="1162" y1="560" x2="1262" y2="560" stroke-width="2.5" opacity="0.32"/>
    <line x1="1188" y1="596" x2="1252" y2="596" stroke-width="3" opacity="0.26"/>
    <line x1="1150" y1="642" x2="1280" y2="642" stroke-width="3" opacity="0.2"/>
    <line x1="1176" y1="700" x2="1268" y2="700" stroke-width="4" opacity="0.15"/>
    <line x1="1140" y1="772" x2="1300" y2="772" stroke-width="5" opacity="0.1"/>
  </g>

  <!-- calm swell bands across the sea -->
  <g fill="none" stroke-linecap="round">
    <path d="M 0 555 Q 400 545 800 555 T 1600 553" stroke="#4E9C9C" stroke-width="1.5" opacity="0.22"/>
    <path d="M 0 615 Q 420 602 820 615 T 1600 611" stroke="#4E9C9C" stroke-width="2" opacity="0.17"/>
    <path d="M 0 690 Q 380 674 800 690 T 1600 684" stroke="#4E9C9C" stroke-width="2.5" opacity="0.13"/>
    <path d="M 0 780 Q 440 762 840 780 T 1600 774" stroke="#4E9C9C" stroke-width="3" opacity="0.1"/>
  </g>
  <rect x="0" y="548" width="1600" height="3" fill="url(#bandFade)" opacity="0.35"/>

  <!-- key-with-house-bow motif, right side, quiet line art -->
  <g transform="translate(1372,640) rotate(-32)" fill="none" stroke="#E3C08F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.38">
    <!-- bow: house pentagon -->
    <path d="M 0 -46 L 40 -12 L 40 40 L -40 40 L -40 -12 Z"/>
    <!-- door / keyhole inside the bow -->
    <circle cx="0" cy="6" r="9"/>
    <path d="M 0 15 L 0 32"/>
    <!-- shaft -->
    <path d="M 40 14 L 148 14"/>
    <!-- key teeth -->
    <path d="M 112 14 L 112 40 M 134 14 L 134 32 M 148 14 L 148 44"/>
  </g>

  <!-- faint echo of the motif -->
  <g transform="translate(1090,760) rotate(-32) scale(0.55)" fill="none" stroke="#4E9C9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.18">
    <path d="M 0 -46 L 40 -12 L 40 40 L -40 40 L -40 -12 Z"/>
    <circle cx="0" cy="6" r="9"/>
    <path d="M 0 15 L 0 32"/>
    <path d="M 40 14 L 148 14"/>
    <path d="M 112 14 L 112 40 M 134 14 L 134 32 M 148 14 L 148 44"/>
  </g>

  <!-- sparse stars, upper left kept quiet for overlay text below -->
  <g fill="#F1ECE2">
    <circle cx="180" cy="96" r="1.6" opacity="0.4"/>
    <circle cx="420" cy="60" r="1.2" opacity="0.3"/>
    <circle cx="640" cy="130" r="1.4" opacity="0.35"/>
    <circle cx="860" cy="70" r="1.2" opacity="0.28"/>
    <circle cx="300" cy="180" r="1" opacity="0.25"/>
    <circle cx="1010" cy="150" r="1.3" opacity="0.3"/>
    <circle cx="1480" cy="90" r="1.5" opacity="0.35"/>
  </g>

  <!-- edge vignette to seat overlay text -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#vignette)"/>
</svg>
</body>
</html>
