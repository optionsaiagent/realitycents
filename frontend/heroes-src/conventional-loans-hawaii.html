<!-- conventional-loans-hawaii — classical pediment and columns, the standard path -->
<style>
  html,body{margin:0;padding:0;}
  body{width:1600px;height:900px;overflow:hidden;background:#f5ede4;}
  svg{display:block;}
</style>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#f5ede4"/>

  <!-- disc behind the pediment apex -->
  <circle cx="800" cy="300" r="150" fill="#ebb890" opacity="0.4"/>

  <!-- pediment -->
  <path d="M800 190 L1090 388 L510 388 Z" fill="#fcfaf6" stroke="#061c31" stroke-width="8" stroke-linejoin="round"/>
  <path d="M800 238 L1010 380 L590 380 Z" fill="none" stroke="#d39562" stroke-width="3"/>

  <!-- entablature -->
  <rect x="486" y="404" width="628" height="26" fill="#061c31"/>
  <line x1="486" y1="446" x2="1114" y2="446" stroke="#008687" stroke-width="4"/>

  <!-- columns: paired-line shafts with caps and bases -->
  <g stroke="#061c31" stroke-width="7" stroke-linecap="round">
    <g>
      <rect x="536" y="462" width="60" height="14" fill="#061c31" stroke="none"/>
      <line x1="552" y1="482" x2="552" y2="672"/>
      <line x1="580" y1="482" x2="580" y2="672"/>
      <rect x="530" y="678" width="72" height="16" fill="#061c31" stroke="none"/>
    </g>
    <g>
      <rect x="682" y="462" width="60" height="14" fill="#061c31" stroke="none"/>
      <line x1="698" y1="482" x2="698" y2="672"/>
      <line x1="726" y1="482" x2="726" y2="672"/>
      <rect x="676" y="678" width="72" height="16" fill="#061c31" stroke="none"/>
    </g>
    <g>
      <rect x="858" y="462" width="60" height="14" fill="#061c31" stroke="none"/>
      <line x1="874" y1="482" x2="874" y2="672"/>
      <line x1="902" y1="482" x2="902" y2="672"/>
      <rect x="852" y="678" width="72" height="16" fill="#061c31" stroke="none"/>
    </g>
    <g>
      <rect x="1004" y="462" width="60" height="14" fill="#061c31" stroke="none"/>
      <line x1="1020" y1="482" x2="1020" y2="672"/>
      <line x1="1048" y1="482" x2="1048" y2="672"/>
      <rect x="998" y="678" width="72" height="16" fill="#061c31" stroke="none"/>
    </g>
  </g>

  <!-- central doorway between the middle columns -->
  <rect x="768" y="530" width="64" height="148" fill="#008687" opacity="0.85"/>

  <!-- stepped stylobate -->
  <line x1="470" y1="712" x2="1130" y2="712" stroke="#061c31" stroke-width="7" stroke-linecap="round"/>
  <line x1="420" y1="740" x2="1180" y2="740" stroke="#061c31" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <line x1="370" y1="766" x2="1230" y2="766" stroke="#061c31" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- flanking hairlines -->
  <line x1="150" y1="560" x2="330" y2="560" stroke="#dfd6c9" stroke-width="2.5"/>
  <line x1="1270" y1="560" x2="1450" y2="560" stroke="#dfd6c9" stroke-width="2.5"/>
</svg>
