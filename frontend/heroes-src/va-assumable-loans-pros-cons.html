<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>va-assumable-loans-pros-cons</title>
<style>

    font-family: "PlexMono";

    font-weight: 700;

  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 900px;
    overflow: hidden; position: relative;
    background: linear-gradient(180deg, #fcfaf6 0%, #f5ede4 68%, #ece1d2 100%);

  .sun {
    position: absolute; left: 90px; top: 60px; width: 300px; height: 300px;

<body>
  <div class="sun"></div>
  <svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gNavyV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#192f46"/><stop offset="1" stop-color="#061c31"/>
      </linearGradient>
      <marker id="arrowTeal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#008687" stroke-width="2"/>

    </defs>

    <!-- distant sun ring -->
    <circle cx="240" cy="210" r="92" fill="none" stroke="#d39562" stroke-width="1.5" opacity="0.5"/>

    <!-- ground line -->
    <line x1="150" y1="640" x2="1450" y2="640" stroke="#061c31" stroke-width="1.5" opacity="0.28"/>

    <!-- LEFT: seller home (solid) -->

      <rect x="272" y="472" width="296" height="168" fill="url(#gNavyV)"/>
      <rect x="506" y="368" width="30" height="62" fill="#192f46"/>
      <rect x="386" y="530" width="68" height="110" fill="#f5ede4"/>

      <rect x="486" y="500" width="52" height="44" fill="#2ca2a2" opacity="0.9"/>
    </g>

    <!-- RIGHT: buyer home (outline) -->
    <g stroke="#061c31" stroke-width="2.5" fill="rgba(0,134,135,0.06)">
      <path d="M 1010 472 L 1180 340 L 1350 472 Z"/>
      <rect x="1032" y="472" width="296" height="168"/>
      <rect x="1146" y="530" width="68" height="110" fill="#f5ede4"/>
      <rect x="1062" y="500" width="52" height="44" fill="none"/>
      <rect x="1246" y="500" width="52" height="44" fill="none"/>
    </g>

    <!-- handoff arc -->
    <path d="M 470 322 C 610 150, 990 150, 1122 318" fill="none" stroke="#008687" stroke-width="2.5" stroke-dasharray="10 12" marker-end="url(#arrowTeal)"/>

    <!-- rate badge at apex -->
    <g>
      <circle cx="800" cy="212" r="86" fill="#fcfaf6" stroke="#d39562" stroke-width="3"/>

      <text x="800" y="226" text-anchor="middle" font-family="PlexMono, monospace" font-weight="700" font-size="36" fill="#061c31">2.75%</text>
    </g>

    <!-- pros / cons scale hint below -->
    <g>
      <g transform="rotate(-4 800 700)">
        <line x1="656" y1="700" x2="944" y2="700" stroke="#061c31" stroke-width="2.5"/>
        <line x1="668" y1="700" x2="668" y2="726" stroke="#061c31" stroke-width="1.5"/>
        <line x1="932" y1="700" x2="932" y2="726" stroke="#061c31" stroke-width="1.5"/>
        <path d="M 632 726 A 36 36 0 0 0 704 726 Z" fill="none" stroke="#061c31" stroke-width="1.5"/>
        <path d="M 896 726 A 36 36 0 0 0 968 726 Z" fill="none" stroke="#061c31" stroke-width="1.5"/>
        <circle cx="656" cy="720" r="7" fill="#008687"/>
        <circle cx="674" cy="720" r="7" fill="#008687"/>
        <circle cx="690" cy="720" r="7" fill="#008687"/>
        <circle cx="932" cy="720" r="7" fill="#192f46"/>
      </g>
      <path d="M 800 704 L 780 752 L 820 752 Z" fill="#d39562"/>
      <line x1="710" y1="752" x2="890" y2="752" stroke="#061c31" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- subtle transfer motion ticks under arc -->
    <g stroke="#d39562" stroke-width="2" opacity="0.55">
      <line x1="700" y1="330" x2="726" y2="322"/>
      <line x1="760" y1="342" x2="786" y2="334"/>
      <line x1="820" y1="342" x2="846" y2="334"/>

  </svg>
</body>
</html>
