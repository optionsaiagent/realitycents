<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>page-about</title>
<style>
  html,body{margin:0;padding:0;width:1600px;height:900px;overflow:hidden;background:#0C2340;}
  svg{display:block;}
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1D36"/>
      <stop offset="0.5" stop-color="#12324C"/>
      <stop offset="0.78" stop-color="#2C5560"/>
      <stop offset="1" stop-color="#54706A"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3C08F" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#C9995F" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#C9995F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1DDB8"/>
      <stop offset="1" stop-color="#C9995F"/>
    </linearGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28546B"/>
      <stop offset="1" stop-color="#1B3D55"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4256"/>
      <stop offset="1" stop-color="#12304A"/>
    </linearGradient>
    <linearGradient id="ridge3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122E48"/>
      <stop offset="1" stop-color="#0C2340"/>
    </linearGradient>
    <linearGradient id="ridge4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2038"/>
      <stop offset="1" stop-color="#081627"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.44" cy="0.45" r="0.95">
      <stop offset="0.55" stop-color="#06111F" stop-opacity="0"/>
      <stop offset="1" stop-color="#06111F" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- dusk sky -->
  <rect width="1600" height="900" fill="url(#dusk)"/>

  <!-- warm glow behind the sun -->
  <ellipse cx="1150" cy="380" rx="520" ry="380" fill="url(#warmGlow)"/>

  <!-- fine contour arcs echoing the sun -->
  <g fill="none" stroke="#E3C08F" stroke-width="1.2">
    <circle cx="1150" cy="380" r="180" opacity="0.16"/>
    <circle cx="1150" cy="380" r="255" opacity="0.11"/>
    <circle cx="1150" cy="380" r="335" opacity="0.07"/>
  </g>

  <!-- sun disc -->
  <circle cx="1150" cy="380" r="112" fill="url(#sunDisc)"/>
  <circle cx="1150" cy="380" r="112" fill="none" stroke="#F1ECE2" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- layered ridge lines -->
  <path d="M 0 560 L 190 505 Q 260 486 330 502 L 520 550 Q 600 570 690 556 L 900 520 Q 1010 502 1120 526 L 1330 574 Q 1470 604 1600 588 L 1600 900 L 0 900 Z"
        fill="url(#ridge1)"/>
  <path d="M 0 560 L 190 505 Q 260 486 330 502 L 520 550 Q 600 570 690 556 L 900 520 Q 1010 502 1120 526 L 1330 574 Q 1470 604 1600 588"
        fill="none" stroke="#E3C08F" stroke-width="1.6" opacity="0.4"/>

  <path d="M 0 668 L 150 630 Q 250 606 360 628 L 560 672 Q 680 698 800 676 L 1020 636 Q 1150 614 1290 646 L 1600 712 L 1600 900 L 0 900 Z"
        fill="url(#ridge2)"/>
  <path d="M 0 668 L 150 630 Q 250 606 360 628 L 560 672 Q 680 698 800 676 L 1020 636 Q 1150 614 1290 646 L 1600 712"
        fill="none" stroke="#E3C08F" stroke-width="1.2" opacity="0.22"/>

  <path d="M 0 750 L 220 716 Q 340 698 470 722 L 700 766 Q 830 790 970 764 L 1200 722 Q 1340 700 1600 748 L 1600 900 L 0 900 Z"
        fill="url(#ridge3)"/>
  <path d="M 0 750 L 220 716 Q 340 698 470 722 L 700 766 Q 830 790 970 764 L 1200 722 Q 1340 700 1600 748"
        fill="none" stroke="#4E9C9C" stroke-width="1.2" opacity="0.18"/>

  <path d="M 0 834 L 260 806 Q 420 790 590 812 L 880 850 Q 1050 872 1240 848 L 1600 806 L 1600 900 L 0 900 Z"
        fill="url(#ridge4)"/>

  <!-- drifting contour hairlines in the sky, very quiet -->
  <g fill="none" stroke="#4E9C9C" stroke-width="1">
    <path d="M 0 250 Q 400 236 820 252 T 1600 244" opacity="0.1"/>
    <path d="M 0 330 Q 420 318 840 332 T 1600 326" opacity="0.08"/>
  </g>

  <!-- edge vignette -->
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
</body>
</html>
